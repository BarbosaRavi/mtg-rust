[package]
name = "rust-mtg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
dunce = "1.0.5"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "file"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
rmcp = { version = "3.5.1", features = ["transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt"] }
toml = "1.1.8"

[profile.dev.package."*"]
opt-level = 2
